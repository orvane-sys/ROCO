name: Release

# Runs when a version tag is pushed: git tag v0.1.0 && git push origin v0.1.0
# It refuses a tag that does not match package.json, a CHANGELOG entry without a date, and a repo whose contact address is still a
# placeholder (scripts/check-release.mjs). It then builds the page, packs it into a wheel with the bridge and the launcher, and
# publishes a GitHub release with the CHANGELOG entry as its text, the wheel, and the page as a zip.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # to create the release; nothing else in this workflow writes

jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Check the tag, the CHANGELOG and the contact address
        run: node scripts/check-release.mjs --release "$GITHUB_REF_NAME"

      - name: Install, check and build the page
        run: |
          npm ci
          npx tsc -b
          npm run lint
          npm run build

      - name: Pack the page into a wheel and try it in a clean environment
        run: |
          python -m pip install --upgrade pip build
          python scripts/check_wheel.py --out dist-py

      - name: Zip the page
        run: |
          version="${GITHUB_REF_NAME#v}"
          (cd dist && zip -qr "../roco-dist-${version}.zip" .)
          ls -l "roco-dist-${version}.zip"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          node scripts/check-release.mjs --notes > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" \
            "roco-dist-${version}.zip" dist-py/*.whl \
            --title "ROCO ${version}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag
