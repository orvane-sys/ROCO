name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the clone-size check below counts the whole history

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml

      - name: Install the page's packages
        run: npm ci

      - name: Install the bridge's packages
        # unitree_sdk2py at the commit ROCO was checked against. --no-deps: it lists opencv-python, which no module it
        # imports needs.
        run: |
          python -m pip install numpy pyyaml pyflakes cyclonedds==0.10.2
          python -m pip install --no-deps "git+https://github.com/unitreerobotics/unitree_sdk2_python.git@a035adeaa6f8ea171bef9a43e8477abb87a0b35e"

      - name: Type check
        run: npx tsc -b

      - name: Lint and page checks
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Python lint
        run: python -m pyflakes scripts tools

      - name: Bridge self-test
        run: python scripts/roco_dds_bridge.py --self-test

      - name: Launcher self-test
        run: python scripts/roco --self-test

      - name: Simulator bridge self-test
        run: python tools/sim-drive/mujoco_roco_bridge.py --self-test

      - name: Regression tests (real bridge processes)
        run: python scripts/regress.py

      - name: Clone size under 25 MB
        run: |
          bytes=$(git rev-list --objects --all | git pack-objects --stdout -q | wc -c)
          echo "a full clone is $((bytes / 1024 / 1024)) MB"
          test "$bytes" -lt 26214400
