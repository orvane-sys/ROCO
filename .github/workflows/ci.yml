name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0 # the clone-size check below counts the whole history

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml

      - name: Install the page's packages
        run: npm ci

      - name: Install the bridge's packages
        # unitree_sdk2py at the commit ROCO was checked against, used from its source folder as on the dev PC: a pip build
        # leaves out unitree_sdk2py/b2 (no __init__.py), which the package's own __init__ imports.
        run: |
          python -m pip install numpy pyyaml pyflakes build cyclonedds==0.10.2
          git clone --quiet https://github.com/unitreerobotics/unitree_sdk2_python.git "$RUNNER_TEMP/unitree_sdk2_python"
          git -C "$RUNNER_TEMP/unitree_sdk2_python" checkout --quiet a035adeaa6f8ea171bef9a43e8477abb87a0b35e
          echo "PYTHONPATH=$RUNNER_TEMP/unitree_sdk2_python" >> "$GITHUB_ENV"
          PYTHONPATH="$RUNNER_TEMP/unitree_sdk2_python" python -c "from unitree_sdk2py.core import channel; print('DDS packages import')"

      - name: Type check
        run: npx tsc -b

      - name: Lint and page checks
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Page layout in Chrome
        run: npm run check:layout

      - name: Accessibility in Chrome
        run: npm run check:a11y

      - name: Python lint
        run: python -m pyflakes scripts tools

      - name: Bridge self-test
        run: python scripts/roco_dds_bridge.py --self-test

      - name: Launcher self-test
        run: python scripts/roco --self-test

      - name: Simulator bridge self-test
        run: python tools/sim-drive/mujoco_roco_bridge.py --self-test

      - name: Regression tests (real bridge processes)
        run: python scripts/regress.py

      - name: Wheel builds and works in a clean environment
        run: python scripts/check_wheel.py

      - name: Clone size under 40 MB
        run: |
          bytes=$(git rev-list --objects --all | git pack-objects --stdout -q | wc -c)
          echo "a full clone is $((bytes / 1024 / 1024)) MB"
          test "$bytes" -lt 41943040
