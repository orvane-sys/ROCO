name: Bug report
description: Something ROCO showed or did was wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks. A security problem goes through the Security tab (Report a vulnerability), not here.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      placeholder: "The ankle alert stayed open after the robot sat down; I expected it to close."
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Data source
      options:
        - Live robot
        - Simulator (unitree_mujoco)
        - Replay of a recording
        - Demo (sample recording)
    validations:
      required: true
  - type: input
    id: robot
    attributes:
      label: Robot model and firmware
      placeholder: "G1 29-DoF EDU, type 6 (waist locked), firmware 1.x"
    validations:
      required: true
  - type: input
    id: ctrl
    attributes:
      label: g1_ctrl version or commit
      placeholder: "deploy_lock at commit abc1234, or 'not running'"
  - type: input
    id: roco
    attributes:
      label: ROCO version or commit
      placeholder: "v0.1.0, or git rev-parse --short HEAD"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: "Firefox 140 on Ubuntu 22.04"
  - type: textarea
    id: report
    attributes:
      label: Session report
      description: Review, then Save report, and paste the Markdown or attach the file. Folder paths in it are cut to file names.
      render: markdown
  - type: textarea
    id: console
    attributes:
      label: Bridge console output
      description: The lines the bridge printed, from its start to the problem.
      render: text
