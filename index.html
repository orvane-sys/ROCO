<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ROCO · G1 test monitor</title>
    <meta name="description" content="Read-only browser monitor for the Unitree G1: live 3D view, limit alerts and session replay." />
    <!-- the dark theme's header colour; src/services/uiPrefs.ts sets it from the chosen theme -->
    <meta name="theme-color" content="#020617" />
    <script>
      // Same keys and rules as src/services/uiPrefs.ts: sets the theme and text size before the first paint.
      ;(function () {
        try {
          var p = JSON.parse(localStorage.getItem('roco.ui.v1') || '{}')
          var t = p.theme
          if (t !== 'dark' && t !== 'light' && t !== 'contrast') {
            t = matchMedia('(forced-colors: active)').matches || matchMedia('(prefers-contrast: more)').matches ? 'contrast' : 'dark'
          }
          document.documentElement.dataset.theme = t
          if (p.textScale === 115 || p.textScale === 130) document.documentElement.style.fontSize = p.textScale + '%'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
